<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ruel@alarcon:~$</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="crt-container">
            <div class="crt-overlay"></div>
            <div class="crt-scanlines"></div>
            <div class="crt-flicker"></div>
        </div>

        <header class="terminal-header">
            <span class="header-text">ruel@alarcon:~$</span>
            <span class="header-time" id="header-time"></span>
        </header>

        <div class="container">
            <div id="logo"></div>
            <div class="content" id="content">
                <div class="buttons" id="buttons">
                    <a
                        href="https://github.com/ruelalarcon"
                        class="btn"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-default="[ github ]"
                        data-hover="[ github/ruelalarcon ]"
                        data-description="This is my primary github. You can find my open source projects here."
                        >[ github ]</a
                    >
                    <a
                        href="https://github.com/riptxde"
                        class="btn"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-default="[ alt ]"
                        data-hover="[ github/riptxde ]"
                        data-description="This is my secondary github, where I go by my alias 'riptxde'. Those who know me as riptxde usually don't know my real name, but you can verify my identity regardless by matching the SHA256 hash of 'ruelalarcon' to my profile description."
                        >[ alt ]</a
                    >
                    <a
                        href="https://www.linkedin.com/in/ruelnalarcon/"
                        class="btn"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-default="[ linkedin ]"
                        data-hover="[ linkedin/ruelnalarcon ]"
                        data-description="My professional profile. Feel free to connect with me and check out my very occasional posts."
                        >[ linkedin ]</a
                    >
                    <a
                        href="https://riptxde.itch.io/"
                        class="btn"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-default="[ itch.io ]"
                        data-hover="[ riptxde.itch.io ]"
                        data-description="My game development portfolio, where you can find a few games I've created with my groupmates for University and for Game Jams."
                        >[ itch.io ]</a
                    >
                    <a
                        href="mailto:ruel.alarcon@usask.ca"
                        class="btn"
                        data-default="[ email ]"
                        data-hover="[ ruel.alarcon@usask.ca ]"
                        data-description="Send me an email. I'm sure I'd love to hear from you."
                        >[ email ]</a
                    >
                    <a
                        href="video"
                        class="btn"
                        id="videoBtn"
                        data-default="[ . ]"
                        data-hover="[ ? ]"
                        data-description="What's this?"
                        >[ . ]</a
                    >
                </div>
                <div
                    class="description"
                    id="description"
                    data-default="Hiya there~! Try hovering over the buttons above."
                >
                    <span class="text-content"
                        >Hiya there~! Try hovering over the buttons above.</span
                    ><span class="cursor block">█</span>
                </div>
            </div>
        </div>

        <footer class="terminal-footer">
            <span>uwu~</span>
        </footer>

        <script type="module" src="index.js"></script>
    </body>
</html>
